<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Tiempo</title>
</head>

<header class="app-header">
    <div class="brand">
        <img src="assets/web-document/logo.svg" alt="logo de la marca">
    </div>

    <div class="header-actions">
        <div class="dropdown" id="unitsDropdown">
            <button class="dropbtn" id="unitsBtn">
                ⚙ Units
            </button>

            <div class="dropdown-content">
                <button class="switch-btn" id="switchUnits">
                    Switch to Imperial
                </button>

                <div class="group">
                    <p class="group-title">Temperature</p>
                    <p class="option" data-type="temp">Celsius (°C)  </p>
                    <p class="option hidden" data-type="temp">Fahrenheit (°F)</p>
                </div>

                <div class="group">
                    <p class="group-title">Wind Speed</p>
                    <p class="option" data-type="wind">km/h</p>
                    <p class="option hidden" data-type="wind">mph</p>
                </div>

                <div class="group">
                    <p class="group-title">Precipitation</p>
                    <p class="option" data-type="rain">Millimeters (mm)</p>
                    <p class="option hidden" data-type="rain">Inches (in)</p>
                </div>
            </div>
        </div>
    </div>
</header>

<body>
    <h1 class="main-title">How's the sky looking today?</h1>
   
    <div class="input-search">
        <input type="search" id="searchPlace" name="q" placeholder="Search for a place..."/>
        <button class="search-button">
            Search
        </button>
    </div>


</body>
<script src="js/app.js"></script>
</html>
